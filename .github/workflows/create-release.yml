name: Create Release

on:
  workflow_run:
    workflows: ["Version and Tag"]
    types:
      - completed

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine release tag
      id: version_check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAGS=$(git tag -l "v*" --sort=-version:refname)

        if [ -z "$TAGS" ]; then
          echo "No tags found. Skipping release."
          echo "should_release=false" >> $GITHUB_OUTPUT
          echo "reason=No version tags found." >> $GITHUB_OUTPUT
          exit 0
        fi

        LATEST_TAG=$(echo "$TAGS" | sed -n 1p)
        PREVIOUS_TAG=$(echo "$TAGS" | sed -n 2p)

        echo "Latest tag: $LATEST_TAG"
        echo "Previous tag: ${PREVIOUS_TAG:-<none>}"
        echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

        # Every new version (major, minor or patch) gets a release.
        # Only skip when a release for the latest tag already exists
        # (e.g. the version workflow ran again without creating a new tag).
        if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
          echo "Release $LATEST_TAG already exists. Skipping."
          echo "should_release=false" >> $GITHUB_OUTPUT
          echo "reason=Release $LATEST_TAG already exists." >> $GITHUB_OUTPUT
        else
          echo "New version detected. Creating release."
          echo "should_release=true" >> $GITHUB_OUTPUT
        fi

    - name: Create release branch
      if: steps.version_check.outputs.should_release == 'true'
      run: |
        LATEST_TAG="${{ steps.version_check.outputs.latest_tag }}"
        BRANCH_NAME="releases/$LATEST_TAG"

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH_NAME" "$LATEST_TAG"
        git push origin "$BRANCH_NAME"

        echo "Release branch created: $BRANCH_NAME"

    - name: Create GitHub Release
      if: steps.version_check.outputs.should_release == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        LATEST_TAG="${{ steps.version_check.outputs.latest_tag }}"
        PREVIOUS_TAG="${{ steps.version_check.outputs.previous_tag }}"

        if [ -n "$PREVIOUS_TAG" ]; then
          gh release create "$LATEST_TAG" \
            --title "Release $LATEST_TAG" \
            --generate-notes \
            --notes-start-tag "$PREVIOUS_TAG"
        else
          gh release create "$LATEST_TAG" \
            --title "Release $LATEST_TAG" \
            --generate-notes
        fi

    - name: Summary
      if: steps.version_check.outputs.should_release == 'true'
      run: |
        echo "## Release Created" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Tag: \`${{ steps.version_check.outputs.latest_tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Branch: \`releases/${{ steps.version_check.outputs.latest_tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Previous Tag: \`${{ steps.version_check.outputs.previous_tag }}\`" >> $GITHUB_STEP_SUMMARY

    - name: Summary (Skipped)
      if: steps.version_check.outputs.should_release != 'true'
      run: |
        echo "## Release Skipped" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.version_check.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
